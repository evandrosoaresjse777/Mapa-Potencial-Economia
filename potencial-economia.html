<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Potencial de Economia – Mercado Livre de Energia</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#5f6b7a;--bd:#d8dde3;--none:#cfd5dc;--c0:#d6efe0;--c1:#2e8b57;--hov:#0b5d8f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181d;--card:#1d232a;--tx:#e8ecf0;--mut:#9aa6b4;--bd:#323b45;--none:#3a444f;--c0:#1f4a35;--c1:#5fd392;--hov:#6cb8e8}}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:900px;margin:0 auto;padding:20px 16px}
h1{font-size:1.4rem;margin:0 0 4px}
p.sub{margin:0 0 16px;color:var(--mut);font-size:.95rem}
.filtro{margin-bottom:12px}
.filtro .lb{font-size:.8rem;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:6px}
#ramos,#tipos{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:.85rem;padding:6px 12px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--c1);border-color:var(--c1);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#08210f}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat .lb{font-size:.8rem;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.stat strong{font-size:1.9rem;line-height:1.2}
.stat .sb{font-size:.85rem;color:var(--mut);min-height:1.2em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;position:relative}
svg{width:100%;height:auto;max-height:78vh;display:block}
svg path{stroke:var(--bg);stroke-width:.6;cursor:pointer;transition:opacity .15s}
svg path:hover,svg path.on{stroke:var(--hov);stroke-width:1.6}
.legend{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.85rem;color:var(--mut);flex-wrap:wrap}
.bar{height:10px;width:160px;border-radius:5px;background:linear-gradient(90deg,var(--c0),var(--c1))}
.sw{width:12px;height:12px;border-radius:3px;background:var(--none)}
#tip{position:fixed;z-index:5;pointer-events:none;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.18);font-size:.9rem;min-width:190px;max-width:260px;display:none}
#tip h2{font-size:1rem;margin:0 0 6px}
#tip .row{display:flex;justify-content:space-between;gap:12px;padding:2px 0}
#tip .v{font-weight:600}
#tip .na{color:var(--mut);font-style:italic}
</style>
</head>
<body>
<main>
<h1>Potencial de economia no Mercado Livre de Energia</h1>
<p class="sub">Passe o mouse (ou toque) sobre um estado para ver a economia estimada por distribuidora.</p>
<section class="filtro"><span class="lb">Ramo de atividade</span><div id="ramos"></div></section>
<section class="filtro"><span class="lb">Tipo de distribuidora</span><div id="tipos"></div></section>
<div class="layout">
<div class="card">
<svg id="map" viewBox="-1438 -107 811 784" role="img" aria-label="Mapa do Brasil por estado"></svg>
<div class="legend"><span id="lmin">0%</span><div class="bar"></div><span id="lmax">0%</span><span class="sw" style="margin-left:12px"></span><span>sem dados</span></div>
</div>
<aside class="painel">
<section class="stats">
<div class="stat"><span class="lb">Média do Brasil</span><strong id="br">—</strong><span id="brs" class="sb"></span></div>
<div class="stat"><span class="lb" id="estn">Estado selecionado</span><strong id="est">—</strong><span id="ests" class="sb"></span></div>
<div class="stat"><span class="lb">Maior economia</span><strong id="top">—</strong><span id="tops" class="sb"></span></div>
</section>
<div class="card"><h2 id="dlistt" style="font-size:1rem;margin:0 0 8px">Distribuidoras</h2><div class="dlist" id="dlist"></div></div>
</aside>
</div>
</main>

  $("lmin").textContent=fmt(min);$("lmax").textContent=fmt(max);
  svg.querySelectorAll("path").forEach(p=>p.style.fill=cor(media(p.dataset.uf)));
  $("br").textContent=mediaBR==null?"—":fmt(mediaBR);
  $("brs").textContent=`${comDado.length} de ${todas.length} distribuidoras com dados`;
  if(comDado.length){const m=comDado.reduce((a,b)=>b.economia>a.economia?b:a);$("top").textContent=fmt(m.economia);$("tops").textContent=`${m.nome} (${m.uf})`}else{$("top").textContent="—";$("tops").textContent=""}
  card(atual||fixo);
}
function listaPainel(uf){
  const b=$("dlist");if(!b)return;
  if(!uf){b.innerHTML='<p class="na">Passe o mouse ou clique em um estado para ver todas as distribuidoras.</p>';$("dlistt").textContent="Distribuidoras";return}
  const l=lista(uf).sort((a,b)=>(b.economia??-1e9)-(a.economia??-1e9));
  $("dlistt").textContent=`${NOMES[uf]}: ${l.length} distribuidoras`;
  b.innerHTML=l.map(d=>`<div class="row"><span>${d.nome}</span><span class="v ${d.economia==null?"na":""}">${d.economia==null?"sem dado":fmt(d.economia)}</span></div>`).join("")||'<p class="na">Nenhuma distribuidora para o filtro escolhido.</p>';
}
function card(uf){
  atual=uf;listaPainel(uf);const el=$("est"),sub=$("ests"),m=uf?media(uf):null;
  $("estn").textContent=uf?`Média ${NOMES[uf]}`:"Estado selecionado";
  if(!uf){el.textContent="—";sub.textContent="Passe o mouse ou clique em um estado";return}
  if(m==null){el.textContent="—";sub.textContent="Sem dados ainda";return}
  el.textContent=fmt(m);const d=m-mediaBR;
  sub.textContent=`${d>=0?"+":"−"}${Math.abs(d).toLocaleString("pt-BR",{maximumFractionDigits:1})} p.p. vs. média do Brasil`;
}
function show(uf,x,y){
  const l0=lista(uf).sort((a,b)=>(b.economia??-1e9)-(a.economia??-1e9)),l=l0.slice(0,8),mais=l0.length-l.length;let h=`<h2>${NOMES[uf]} (${uf})</h2>`;
  h+=`<div class="na" style="margin-bottom:4px">${sel.size?[...sel].sort((a,b)=>a-b).map(i=>RAMOS[i]).join(", "):"Todos os ramos"}${selT.size?" · "+[...selT].map(x=>x+"s").join(", "):""}</div>`;
  if(!l.length)h+=`<div class="na">Sem dados ainda</div>`;
  l.forEach(d=>{h+=`<div class="row"><span>${d.nome}</span><span class="v ${d.economia==null?"na":""}">${d.economia==null?"sem dado":fmt(d.economia)}</span></div>`});
  if(mais>0)h+=`<div class="na" style="margin-top:4px">+ ${mais} distribuidoras (veja a média no card)</div>`;tip.innerHTML=h;tip.style.display="block";
  const w=tip.offsetWidth,hh=tip.offsetHeight;
  tip.style.left=Math.max(8,Math.min(x+14,innerWidth-w-8))+"px";
  tip.style.top=Math.max(8,Math.min(y+14,innerHeight-hh-8))+"px";
}
function marca(uf){svg.querySelectorAll("path.on").forEach(p=>p.classList.remove("on"));if(uf)svg.querySelector(`path[data-uf="${uf}"]`).classList.add("on")}

/* filtro de ramos */
function chips(){
  const mk=(box,t,on,fn)=>{const b=document.createElement("button");b.className="chip";b.textContent=t;b.setAttribute("aria-pressed",on);b.onclick=fn;box.appendChild(b)};
  const grupo=(id,itens,set,rot)=>{
    const box=$(id);box.innerHTML="";
    mk(box,"Todos",set.size===0,()=>{set.clear();chips();render()});
    itens.forEach(([v,r])=>mk(box,r,set.has(v),()=>{set.has(v)?set.delete(v):set.add(v);if(set.size===itens.length)set.clear();chips();render()}));
  };
  grupo("ramos",RAMOS.map((r,i)=>[i,r]),sel);
  grupo("tipos",TIPOS.map(x=>[x,x+"s"]),selT);
}
svg.addEventListener("pointermove",e=>{const p=e.target.closest("path");if(p){show(p.dataset.uf,e.clientX,e.clientY);card(p.dataset.uf)}else{tip.style.display="none";card(fixo)}});
svg.addEventListener("pointerdown",e=>{const p=e.target.closest("path");if(!p)return;fixo=p.dataset.uf;marca(fixo);p.parentNode.appendChild(p);show(fixo,e.clientX,e.clientY);card(fixo)});
svg.addEventListener("pointerleave",()=>{tip.style.display="none";card(fixo)});
chips();render();
</script>
<script src="menu.js"></script>
