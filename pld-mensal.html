<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PLD Mensal Realizado – Painel do Mercado Livre de Energia</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#5f6b7a;--bd:#d8dde3;--c1:#2e8b57}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181d;--card:#1d232a;--tx:#e8ecf0;--mut:#9aa6b4;--bd:#323b45;--c1:#5fd392}}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:900px;margin:0 auto;padding:20px 16px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{margin:0 0 20px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.item{display:flex;flex-direction:column;gap:6px;padding:16px;background:var(--card);border:1px solid var(--bd);border-radius:12px;color:var(--tx);text-decoration:none}
a.item:hover{border-color:var(--c1)}
.item h2{font-size:1.1rem;margin:0}
.item p{margin:0;color:var(--mut);font-size:.9rem}
.tag{align-self:flex-start;font-size:.75rem;padding:2px 10px;border-radius:999px;border:1px solid var(--bd);color:var(--mut)}
.tag.ok{border-color:var(--c1);color:var(--c1)}
.vazio{padding:32px 16px;text-align:center;color:var(--mut);background:var(--card);border:1px dashed var(--bd);border-radius:12px}

:root{--p1:#00979C;--p2:#1f5fbf;--p3:#e08a00;--p4:#8e5bb5;--grid:#e3e7ec}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--p1:#2cc4c9;--p2:#6cb0ff;--p3:#f0b84a;--p4:#c39be6;--grid:#2c343d}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:16px}
.card h2{font-size:1rem;margin:0 0 8px}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.lb{font-size:.78rem;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font:inherit;font-size:.85rem;padding:6px 13px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--c1);box-shadow:inset 0 0 0 1px var(--c1);font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.per{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
input[type=month],input[type=text],select{font:inherit;font-size:.9rem;padding:7px 9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);min-width:0;width:130px}
select{width:auto}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--tx);text-transform:none;letter-spacing:0;font-size:.9rem;font-weight:600}
.exib{margin:0 0 12px;color:var(--mut);font-size:.9rem}
.stats7{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat .lb{margin:0}.stat strong{font-size:1.45rem;line-height:1.2}.stat .sb{font-size:.78rem;color:var(--mut);min-height:1.1em}
.cw{position:relative}
.cw svg{width:100%;height:auto;display:block;min-width:560px}
.tip{position:absolute;pointer-events:none;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;font-size:.82rem;box-shadow:0 6px 20px rgba(0,0,0,.2);display:none;z-index:5;white-space:nowrap}
.tip b{display:block;margin-bottom:3px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:6px;font-size:.82rem;color:var(--mut)}
.scroll{overflow-x:auto}.scroll.v{max-height:430px;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:600;font-size:.76rem;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;background:var(--card)}
.up{color:#d64545}.down{color:var(--c1)}
.barra{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.btn{font:inherit;font-size:.85rem;padding:6px 14px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
.btn:hover{border-color:var(--c1)}
.nota{font-size:.8rem;color:var(--mut);margin:4px 0 0}
svg text{fill:var(--mut);font-family:inherit}svg text.tt{fill:var(--tx);font-weight:600}</style>
</head>

<main>
<h1>PLD Mensal Realizado</h1>
<p class="sub">Preço de Liquidação das Diferenças (R$/MWh) por submercado. Compare submercados e períodos. Fonte: CCEE.</p>
<div class="card"><div class="ctl">
<div><span class="lb">Submercados</span><div class="chips" id="subs"></div></div>
<div><span class="lb">Período A</span><div class="per"><input id="a1" type="month"><span>até</span><input id="a2" type="month"></div><div class="chips" id="pres"></div></div>
<div><span class="lb"><label class="chk"><input type="checkbox" id="comp"> Comparar com o período B</label></span><div class="per" id="perB"><input id="b1" type="month"><span>até</span><input id="b2" type="month"></div><div class="chips" id="presB"></div></div>
</div></div>
<p class="exib" id="exib"></p>
<section class="stats7" id="cards"></section>
<div class="duo2" id="graficos"></div>
<div class="duo">
<div class="card"><h2>PLD médio por submercado (R$/MWh)</h2><div class="scroll"><div class="cw" id="barras"></div></div><div class="legend" id="legb"></div></div>
<div class="card"><div class="barra"><h2 style="margin:0">Resumo por submercado (R$/MWh)</h2><button class="btn" id="xls">Baixar Excel</button></div><div class="scroll"><table id="resumo"></table></div></div>
</div>
<div class="duo2" id="mensal"></div>
<p class="nota" id="base"></p>
</main>

    (comp?`<div class="card"><h2>Evolução do PLD – período B (${lbL(per.B[0])} a ${lbL(per.B[1])})</h2><div class="scroll"><div class="cw" id="gB"></div></div><div class="legend"><span>Mesma escala do período A, para comparação direta</span></div></div>`:"");
  linhas($("gA"),per.A,ymax);if(comp)linhas($("gB"),per.B,ymax);
  barras();tabelaResumo();
  $("mensal").innerHTML=tabelaMensal(per.A,"Período A")+(comp?tabelaMensal(per.B,"Período B"):"");
}
function excel(){
  const ss=subsSel(),wb=XLSX.utils.book_new(),ps=[["A",per.A]].concat(comp?[["B",per.B]]:[]);
  const rs=[["Submercado","Período","Média (R$/MWh)","Máximo","Mínimo","Mediana","Desvio padrão","Último PLD","Registros"]];
  ps.forEach(([n,p])=>ss.forEach(s=>{const e=est(fat(s,p));rs.push([NOME[s],`${n}: ${lbL(p[0])} a ${lbL(p[1])}`,e.media,e.max,e.min,e.med,e.sd,e.ult,e.n])}));
  const w1=XLSX.utils.aoa_to_sheet(rs);w1["!cols"]=[{wch:14},{wch:26},{wch:16},{wch:11},{wch:11},{wch:11},{wch:14},{wch:12},{wch:10}];XLSX.utils.book_append_sheet(wb,w1,"Resumo");
  ps.forEach(([n,p])=>{const a=[["Mês"].concat(ss.map(s=>NOME[s]+" (R$/MWh)"))];for(let i=p[0];i<=p[1];i++){const[y,m]=MESES[i].split("-");a.push([new Date(+y,+m-1,1,12)].concat(ss.map(s=>PLD[s][i])))}
    const w=XLSX.utils.aoa_to_sheet(a,{cellDates:true});for(let r=1;r<a.length;r++){const c=w[XLSX.utils.encode_cell({r,c:0})];if(c)c.z="mm/yyyy"}w["!cols"]=[{wch:10}].concat(ss.map(()=>({wch:18})));XLSX.utils.book_append_sheet(wb,w,"PLD mensal "+n)});
  XLSX.writeFile(wb,"pld-mensal.xlsx",{compression:true});
}
/* ===== controles ===== */
const chip=(box,t,fn,extra)=>{const b=document.createElement("button");b.className="chip";b.innerHTML=t;b.onclick=fn;if(extra)Object.assign(b.dataset,extra);box.appendChild(b);return b};
SUBS.forEach((s,i)=>chip($("subs"),`<i class="dot" style="background:var(--p${i+1})"></i>${NOME[s]}`,()=>{sel.has(s)?(sel.size>1&&sel.delete(s)):sel.add(s);render()},{s}));
[["12 meses",()=>[U-11,U]],["24 meses",()=>[U-23,U]],["5 anos",()=>[U-59,U]],["Todo o histórico",()=>[0,U]]].forEach(([t,f])=>chip($("pres"),t,()=>{per.A=f();render()}));
const anos=[...new Set(MESES.map(m=>m.slice(0,4)))].reverse(),sa=document.createElement("select");
sa.innerHTML='<option value="">Ano…</option>'+anos.map(a=>`<option>${a}</option>`).join("");
sa.onchange=()=>{if(!sa.value)return;const ix=MESES.map((m,i)=>m.startsWith(sa.value)?i:-1).filter(i=>i>=0);per.A=[ix[0],ix[ix.length-1]];sa.value="";render()};
$("pres").appendChild(sa);
const desloca=d=>{const[a,b]=per.A;return[cl(a+d,0,U),cl(b+d,0,U)]};
chip($("presB"),"Ano anterior",()=>{per.B=desloca(-12);render()});
chip($("presB"),"Período anterior",()=>{per.B=desloca(-(per.A[1]-per.A[0]+1));render()});
["a1","a2","b1","b2"].forEach(i=>$(i).addEventListener("change",render));
$("comp").onchange=e=>{comp=e.target.checked;render()};
$("xls").onclick=excel;
$("base").textContent=`Base disponível: ${lbL(0)} a ${lbL(U)}. Fonte: CCEE. Desvio padrão amostral. Com mais de um submercado, os cartões consideram todas as observações selecionadas (o último PLD é a média dos submercados no último mês).`;
render();
</script>
</body>
</html>
